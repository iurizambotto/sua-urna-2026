[project]
name = "sua-urna-2026"
version = "0.1.0"
description = "Numeros da propria secao eleitoral e roteiro de conversa para o segundo turno de 2026"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "asn1tools>=0.167",
  "pydantic>=2.7",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "bandit>=1.7", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sua_urna_2026 = ["spec/*.asn1", "fonts/*.ttf", "fonts/OFL.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "ANN", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
